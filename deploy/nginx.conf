# /etc/nginx/sites-available/vcoos  (TLS via certbot or your own certificates)
server {
    listen 80;
    server_name vcoos.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name vcoos.example.com;
    ssl_certificate     /etc/letsencrypt/live/vcoos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vcoos.example.com/privkey.pem;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;

    location /static/ { alias /opt/vcoos/staticfiles/; expires 7d; }
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
