{% extends "auth/_shell.html" %}{% block title %}Sign in{% endblock %}
{% block card %}<h1>Sign in</h1><p class="muted">Authorized personnel only.</p>
<form method="post">{% csrf_token %}
{% if form.errors %}<ul class="messages"><li class="error">Invalid username or password.</li></ul>{% endif %}
<div class="field"><label for="id_username">Username</label><input class="input" name="username" id="id_username" autocomplete="username" required autofocus></div>
<div class="field"><label for="id_password">Password</label><input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
<input type="hidden" name="next" value="{{ next }}">
<button class="btn primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
</form><p class="small"><a href="{% url 'password_reset' %}">Forgot password?</a></p>{% endblock %}
