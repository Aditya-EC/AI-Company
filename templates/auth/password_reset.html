{% extends "auth/_shell.html" %}{% block title %}Reset password{% endblock %}
{% block card %}<h1>Reset password</h1><p class="muted">If an account uses this email, a reset link will be sent.</p>
<form method="post">{% csrf_token %}{% include "partials/form_fields.html" %}<button class="btn primary" type="submit">Send reset link</button></form>
<p class="small"><a href="{% url 'login' %}">Back to sign in</a></p>{% endblock %}
