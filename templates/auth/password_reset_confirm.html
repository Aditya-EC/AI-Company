{% extends "auth/_shell.html" %}{% block card %}{% if validlink %}<h1>Choose a new password</h1>
<form method="post">{% csrf_token %}{% include "partials/form_fields.html" %}<button class="btn primary" type="submit">Set password</button></form>
{% else %}<h1>Link invalid</h1><p>This reset link is invalid or has expired.</p><a href="{% url 'password_reset' %}">Request a new one</a>{% endif %}{% endblock %}
