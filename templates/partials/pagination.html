{% if page.has_other_pages %}<div class="pagination">
{% if page.has_previous %}<a class="btn sm" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
<span class="muted small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a class="btn sm" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Next</a>{% endif %}
</div>{% endif %}
