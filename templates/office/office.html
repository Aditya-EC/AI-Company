{% extends "base.html" %}{% load static %}{% block title %}Virtual office{% endblock %}
{% block content %}
{% csrf_token %}
<div class="hq" id="hq">
  <div class="hq-canvas" id="office-canvas" {% if force_2d %}hidden{% endif %}></div>
  <div class="hq-2d" id="office-2d" {% if not force_2d %}hidden{% endif %}></div>

  <div class="hq-bar">
    <div class="hq-title"><strong>Virtual office</strong><span class="hq-sub" id="office-sync">Connecting…</span></div>
    <div class="hq-pills">
      <span class="hq-pill" id="hq-agents">— agents</span>
      <span class="hq-pill" id="hq-engine" title="Engine workers with a recent heartbeat">engine —</span>
      <button class="hq-btn" type="button" id="hq-home" hidden>← Back to HQ</button>
      <a class="hq-btn" href="?mode={% if force_2d %}3d{% else %}2d{% endif %}" id="mode-link">{% if force_2d %}3D view{% else %}2D view{% endif %}</a>
      <button class="hq-btn" type="button" id="hq-fx" title="Glow and shadows">Effects</button>
    </div>
  </div>

  <aside class="hq-panel" id="drawer" aria-live="polite" hidden></aside>
  <div class="hq-feed" id="hq-feed" aria-live="polite"></div>

  <div class="hq-foot">
    <div class="hq-models" id="hq-models"></div>
    <div class="hq-legend" id="office-legend"></div>
  </div>
  <div class="hq-minimap" id="hq-minimap" hidden>
    <canvas id="minimap" width="176" height="132" aria-label="Office map: click a room to fly there"></canvas>
    <div class="hq-map-btns"><button type="button" id="zoom-out" aria-label="Zoom out">−</button><button type="button" id="zoom-fit" aria-label="Show whole office">⤢</button><button type="button" id="zoom-in" aria-label="Zoom in">+</button></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script type="importmap" nonce="{{ request.csp_nonce }}">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script nonce="{{ request.csp_nonce }}">window.VCOOS_OFFICE = {force2d: {{ force_2d|yesno:"true,false" }}, stateUrl: "{% url 'api_office_state' %}", employeeUrl: "/api/employees/", wsPath: "/ws/activity/"};</script>
<script src="{% static 'js/office-common.js' %}"></script>
<script type="module" src="{% static 'js/office3d.js' %}"></script>
<script nonce="{{ request.csp_nonce }}">
  // If the 3D module cannot load (offline CDN, old browser), fall back to 2D after a grace period.
  setTimeout(() => { if (!window.VCOOS_3D_READY && !window.VCOOS_OFFICE.force2d) VCOOSOffice.fallback2d("3D renderer unavailable"); }, 8000);
</script>
{% endblock %}
